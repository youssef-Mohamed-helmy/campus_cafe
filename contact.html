<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Campus Cafe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1 id="site-title">Campus Cafe</h1>
<p class="tagline">Fresh coffee for busy students</p>
<nav>
<a href="index.html">About</a>
<a href="menu.html">Menu</a>
<a href="contact.html">Contact</a>
</nav>
</header>
<main>
<section id="contact">
<h2>Contact / Pre-order</h2>
<form action="#" method="post">
<label for="fname">Name:</label>
<input type="text" id="fname" name="fname" required>

<label for="email">Email:</label>
<input type="email" id="email" name="email" required>

<label for="phone">Number:</label>
<input type="number" id="phone" name="phone">

<label for="date">Date:</label>
<input type="date" id="date" name="date">

<p>Order Type:</p>
<input type="radio" id="pickup" name="order_type" value="pickup">
<label for="pickup">Pickup</label>
<input type="radio" id="dinein" name="order_type" value="dinein">
<label for="dinein">Dine in</label>

<p>Extras:</p>
<input type="checkbox" id="sugar" name="extras" value="sugar">
<label for="sugar">Sugar</label>
<input type="checkbox" id="milk" name="extras" value="milk">
<label for="milk">Milk</label>

<label for="drink">Drink:</label>
<select id="drink" name="drink">
<option value="espresso">Espresso</option>
<option value="latte">Iced Latte</option>
</select>

<label for="msg">Message:</label>
<textarea id="msg" name="msg" rows="4"></textarea>

<button type="submit">Send</button>
</form>
</section>
</main>
<footer>
<p>&copy; 2026 Campus Cafe</p>
</footer>
</body>
</html>
